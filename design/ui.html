<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SILT</title>
<style>
/* SILT: the look of the old flow-visualisation plates (smoke filaments around a body,
   silver on black, grain, a scale bar, a scribbled plate number). Monochrome on purpose. */
:root {
  --black: #050505;
  --ink: #ecebe5;
  --dim: rgba(236, 235, 229, 0.55);
  --faint: rgba(236, 235, 229, 0.28);
  --line: rgba(236, 235, 229, 0.14);
  --line-strong: rgba(236, 235, 229, 0.32);
  --type: "Bahnschrift", "DIN Condensed", "Arial Narrow", sans-serif;
  --mono: "Consolas", "Cascadia Mono", "Courier New", monospace;
  --hand: "Segoe Script", "Bradley Hand", "Georgia", cursive;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--black); }
body { color: var(--ink); font-family: var(--type); -webkit-font-smoothing: antialiased; user-select: none; }
#page { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; background: var(--black); }
#grain { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0.06; mix-blend-mode: screen; z-index: 30; }

/* ---------- the plate ---------- */
#plate { position: absolute; left: 14px; top: 14px; width: 846px; height: 532px; }
#plate canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- right column ---------- */
#side { position: absolute; left: 876px; top: 14px; width: 390px; height: 532px; display: flex; flex-direction: column; }
.brand { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--line-strong); padding-bottom: 8px; }
.brand h1 { font-weight: 300; font-size: 34px; letter-spacing: 0.42em; line-height: 1; }
.brand .sub { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: var(--dim); text-align: right; line-height: 1.5; }
.preset { position: relative; padding: 10px 0 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.preset .k { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; color: var(--dim); }
.preset .name { font-size: 21px; font-weight: 400; letter-spacing: 0.06em; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 70px; }
.preset .note { font-family: var(--mono); font-size: 10px; color: var(--dim); margin-top: 3px; line-height: 1.35; height: 27px; overflow: hidden; padding-right: 70px; }
.preset .arrows { position: absolute; right: 0; top: 14px; display: flex; gap: 4px; }
.preset .arrows button { width: 28px; height: 44px; background: none; border: 1px solid var(--line-strong); color: var(--ink); font-family: var(--mono); font-size: 14px; cursor: pointer; }
.preset .arrows button:hover { background: var(--ink); color: var(--black); }
#menu { display: none; position: absolute; left: 876px; top: 112px; width: 390px; max-height: 660px; overflow-y: auto; background: #0a0a09; border: 1px solid var(--line-strong); z-index: 20; padding: 6px 0; }
#menu.open { display: block; }
#menu .cat { font-family: var(--mono); font-size: 9px; letter-spacing: 0.24em; color: var(--dim); padding: 10px 14px 4px; }
#menu .item { padding: 5px 14px; cursor: pointer; }
#menu .item:hover { background: rgba(236,235,229,0.08); }
#menu .item.on { background: var(--ink); color: var(--black); }
#menu .item .n { font-size: 15px; letter-spacing: 0.04em; }
#menu .item .d { font-family: var(--mono); font-size: 9.5px; opacity: 0.6; margin-top: 1px; }
.hero { padding-top: 11px; cursor: ew-resize; }
.hero .top { display: flex; justify-content: space-between; align-items: baseline; }
.hero .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.24em; color: var(--dim); }
.hero .v { font-size: 20px; font-weight: 400; letter-spacing: 0.04em; }
.hero canvas { display: block; width: 390px; height: 30px; margin-top: 5px; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.panelHead { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; }
.panelHead .t { font-family: var(--mono); font-size: 9px; letter-spacing: 0.24em; color: var(--dim); }
.panelHead .s { font-family: var(--mono); font-size: 9px; color: var(--faint); }
#arrivals, #curve { display: block; width: 390px; margin-top: 4px; border: 1px solid var(--line); }

/* ---------- modules ---------- */
#modules { position: absolute; left: 14px; top: 560px; width: 1252px; height: 228px; display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--line-strong); }
.card { position: relative; border-right: 1px solid var(--line); padding: 9px 12px 0; }
.card:last-child { border-right: none; }
.card.off .ctl, .card.off .chips { opacity: 0.33; }
.card .head { display: flex; align-items: baseline; gap: 8px; height: 20px; }
.card .num { font-family: var(--hand); font-size: 12px; color: var(--dim); }
.card .title { font-size: 14px; font-weight: 400; letter-spacing: 0.3em; flex: 1; }
.power { width: 34px; height: 16px; border: 1px solid var(--line-strong); background: none; color: var(--dim); font-family: var(--mono); font-size: 9px; cursor: pointer; }
.power.on { background: var(--ink); border-color: var(--ink); color: var(--black); }
.chips { display: flex; flex-wrap: wrap; gap: 3px; margin: 7px 0 2px; }
.chip { flex: 1 0 auto; min-width: 46px; height: 18px; padding: 0 4px; border: 1px solid var(--line-strong); background: none; color: var(--dim); font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.04em; cursor: pointer; text-transform: uppercase; }
.chip:hover { color: var(--ink); border-color: var(--ink); }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--black); }
.ctl { margin-top: 7px; cursor: ew-resize; }
.ctl .row { display: flex; justify-content: space-between; align-items: baseline; }
.ctl .lab { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: var(--dim); }
.ctl .val { font-size: 13.5px; letter-spacing: 0.03em; white-space: nowrap; }
/* A value being typed: the same text, on a thin rule. */
.val-edit { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; border-bottom: 1px solid currentColor; padding: 0; margin: 0; outline: none; width: auto; text-align: inherit; }
.ctl .track { position: relative; height: 8px; margin-top: 2px; }
.ctl .track::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 1px; background: var(--line-strong); }
.ctl .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10%); }
.ctl .fill { position: absolute; left: 0; top: 3px; height: 3px; background: var(--ink); opacity: 0.85; }
.ctl .knob { position: absolute; top: -1px; width: 1px; height: 11px; background: var(--ink); }
.ctl:hover .lab { color: var(--ink); }
.ctl.drag .fill { opacity: 1; }
</style>
</head>
<body>
<div id="page">
  <div id="plate"><canvas id="fluid"></canvas><canvas id="hud"></canvas></div>

  <div id="side">
    <div class="brand">
      <h1>SILT</h1>
      <div class="sub">SOUND IN WATER<br>c = 1500 m/s · OATHR</div>
    </div>
    <div class="preset" id="presetBox">
      <div class="k" id="presetCat">PRESET</div>
      <div class="name" id="presetName">—</div>
      <div class="note" id="presetNote"></div>
      <div class="arrows"><button id="prev">‹</button><button id="next">›</button></div>
    </div>
    <div class="hero" id="submergeBox">
      <div class="top"><span class="k">SUBMERGE</span><span class="v" id="submergeVal">—</span></div>
      <canvas id="submergeCanvas"></canvas>
    </div>
    <div class="hero" id="muffleBox">
      <div class="top"><span class="k">MUFFLE</span><span class="v" id="muffleVal">—</span></div>
      <canvas id="muffleCanvas"></canvas>
    </div>
    <div class="levels">
      <div class="hero" id="dryBox"><div class="top"><span class="k">DRY</span><span class="v" id="dryVal" style="font-size:16px">—</span></div><canvas id="dryCanvas" style="width:186px;height:16px"></canvas></div>
      <div class="hero" id="wetBox"><div class="top"><span class="k">WET</span><span class="v" id="wetVal" style="font-size:16px">—</span></div><canvas id="wetCanvas" style="width:186px;height:16px"></canvas></div>
    </div>
    <div class="panelHead"><span class="t">ARRIVALS</span><span class="s" id="arrivalsInfo">—</span></div>
    <canvas id="arrivals" height="74"></canvas>
    <div class="panelHead"><span class="t">WHAT THE EAR KEEPS</span><span class="s" id="curveInfo">—</span></div>
    <canvas id="curve" height="74"></canvas>
  </div>
  <div id="menu"></div>
  <div id="modules"></div>
  <canvas id="grain"></canvas>
</div>

<script type="module">
// ======================================================================================
// Parameters: layout, and a copy of the units for the plate and the browser preview.
// Keep in step with plugin/Source/Params.h. In the plugin, labels come from the host.
// ======================================================================================
const U = {
  distance: t => 0.3 * Math.pow(33333.3, t),
  depth: t => 0.1 * Math.pow(110000, t),
  water: t => Math.pow(11000, t),
  waves: t => 1.5 * t * t,
  sway: t => 4 * t * t,
  echo: t => 5 * Math.pow(600, t),
  tDistance: m => Math.log(m / 0.3) / Math.log(33333.3),
  tDepth: m => Math.log(m / 0.1) / Math.log(110000),
  tWater: m => Math.log(m) / Math.log(11000),
  muffleHz: t => t <= 0 ? 0 : 20000 * Math.pow(90 / 20000, Math.pow(t, 0.75)),
};
const metres = m => m < 10 ? m.toFixed(1) + ' m' : m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(2) + ' km';
const hz = f => f < 1000 ? Math.round(f) + ' Hz' : (f / 1000).toFixed(1) + ' kHz';
const lvl = t => t <= 0 ? 'off' : ((-48 + 60 * t) >= 0 ? '+' : '') + (-48 + 60 * t).toFixed(1) + ' dB';
const pc = t => Math.round(100 * t) + ' %';
const bip = t => { const d = (2 * t - 1) * 12; return (d >= 0 ? '+' : '') + d.toFixed(1) + ' dB'; };
const SPECS = {
  submerge: { kind: 'slider', def: 1, text: pc },
  muffle: { kind: 'slider', def: 0, text: t => t <= 0 ? 'real water' : hz(U.muffleHz(t)) },
  dry: { kind: 'slider', def: 0, text: lvl },  // parallel dry, on top of SUBMERGE
  wet: { kind: 'slider', def: 0.8, text: lvl },
  distance: { kind: 'slider', def: U.tDistance(4), text: t => metres(U.distance(t)), label: 'DISTANCE' },
  src_depth: { kind: 'slider', def: U.tDepth(3), text: t => metres(U.depth(t)), label: 'SOURCE DEPTH' },
  lis_depth: { kind: 'slider', def: U.tDepth(4), text: t => metres(U.depth(t)), label: 'EAR DEPTH' },
  water_depth: { kind: 'slider', def: U.tWater(12), text: t => metres(U.water(t)), label: 'SEA DEPTH' },
  sway: { kind: 'slider', def: Math.sqrt(0.3 / 4), text: t => t <= 0 ? 'still' : U.sway(t).toFixed(2) + ' m', label: 'SWAY' },
  path_on: { kind: 'toggle', def: 1 },
  bottom: { kind: 'choice', def: 1, choices: ['Mud', 'Sand', 'Gravel', 'Rock', 'Reef'] },
  waves: { kind: 'slider', def: Math.sqrt(0.1), text: t => t <= 0 ? 'flat' : U.waves(t).toFixed(2) + ' m', label: 'WAVES' },
  reflections: { kind: 'slider', def: 0.5, text: t => 'x' + (2 * t).toFixed(2), label: 'REFLECTIONS' },
  echo_on: { kind: 'toggle', def: 0 },
  echo_wall: { kind: 'choice', def: 0, choices: ['Cliff', 'Reef', 'Hull', 'Ice'] },
  echo_dist: { kind: 'slider', def: Math.log(12) / Math.log(600), text: t => metres(U.echo(t)) + ', ' + Math.round(2000 * U.echo(t) / 1500) + ' ms', label: 'WALL DISTANCE' },
  echo_fb: { kind: 'slider', def: 0.3, text: pc, label: 'FEEDBACK' },
  echo_level: { kind: 'slider', def: 40 / 60, text: lvl, label: 'LEVEL' },
  water_on: { kind: 'toggle', def: 1 },
  space: { kind: 'choice', def: 1, choices: ['Open sea', 'Bay', 'Pool', 'Cave', 'Wreck', 'Tank', 'Abyss'] },
  size: { kind: 'slider', def: 0.5, text: t => metres(2 * Math.pow(100, t)), label: 'SIZE' },
  decay: { kind: 'slider', def: Math.log(10) / Math.log(100), text: t => (0.2 * Math.pow(100, t)).toFixed(1) + ' s', label: 'DECAY' },
  tone: { kind: 'slider', def: 0.4, text: pc, label: 'TONE' },
  water_level: { kind: 'slider', def: 42 / 60, text: lvl, label: 'LEVEL' },
  ear: { kind: 'choice', def: 1, choices: ['Hydrophone', 'Diver', 'Helmet', 'Cinema'] },
  ear_amount: { kind: 'slider', def: 0.85, text: pc, label: 'AMOUNT' },
  clarity: { kind: 'slider', def: 0.2, text: pc, label: 'CLARITY' },
  width: { kind: 'slider', def: 0.5, text: t => pc(2 * t), label: 'WIDTH' },
  eq_lowcut: { kind: 'slider', def: 0, text: t => t <= 0 ? 'off' : hz(20 * Math.pow(25, t)), label: 'LOW CUT' },
  eq_low: { kind: 'slider', def: 0.5, text: bip, label: 'LOW' },
  eq_mid_freq: { kind: 'slider', def: Math.log(8) / Math.log(80), text: t => hz(100 * Math.pow(80, t)), label: 'MID FREQ' },
  eq_mid: { kind: 'slider', def: 0.5, text: bip, label: 'MID' },
  eq_high: { kind: 'slider', def: 0.5, text: bip, label: 'HIGH' },
};
const MODULES = [
  { title: 'SOURCE', ctls: ['distance', 'src_depth', 'lis_depth', 'water_depth', 'sway'] },
  { title: 'PATHS', power: 'path_on', choice: 'bottom', ctls: ['waves', 'reflections'] },
  { title: 'ECHO', power: 'echo_on', choice: 'echo_wall', ctls: ['echo_dist', 'echo_fb', 'echo_level'] },
  { title: 'REVERB', power: 'water_on', choice: 'space', ctls: ['size', 'decay', 'tone', 'water_level'] },
  { title: 'LISTENER', choice: 'ear', ctls: ['ear_amount', 'clarity', 'width'] },
  { title: 'EQ', ctls: ['eq_lowcut', 'eq_low', 'eq_mid_freq', 'eq_mid', 'eq_high'] },
];

// ======================================================================================
// Bridge to the plugin (JUCE 8 web relays); local values in a browser.
// ======================================================================================
const bridge = {
  juce: null, controls: new Map(), values: new Map(), texts: new Map(), choices: new Map(), listening: new Set(),
  register(id, apply) {
    if (!this.controls.has(id)) this.controls.set(id, []);
    this.controls.get(id).push(apply);
    if (!this.values.has(id)) this.values.set(id, SPECS[id].def);
    apply(this.values.get(id));
    if (this.juce) this.listen(id);
  },
  value(id) { return this.values.has(id) ? this.values.get(id) : SPECS[id].def; },
  text(id) { return this.texts.get(id) ?? SPECS[id].text?.(this.value(id)) ?? ''; },
  state(id) {
    const k = SPECS[id].kind, J = this.juce;
    return k === 'slider' ? J.getSliderState(id) : k === 'toggle' ? J.getToggleState(id) : J.getComboBoxState(id);
  },
  set(id, v) {
    const k = SPECS[id].kind;
    if (k === 'slider') v = Math.min(1, Math.max(0, v));
    this.values.set(id, v);
    if (!this.juce) this.texts.delete(id);
    this.notify(id);
    if (!this.juce) return;
    const st = this.state(id);
    if (k === 'slider') st.setNormalisedValue(v); else if (k === 'toggle') st.setValue(!!v); else st.setChoiceIndex(v);
  },
  drag(id, started) {
    if (!this.juce || SPECS[id].kind !== 'slider') return;
    started ? this.state(id).sliderDragStarted() : this.state(id).sliderDragEnded();
  },
  notify(id) { for (const f of this.controls.get(id) || []) f(this.value(id)); },
  listen(id) {
    if (this.listening.has(id)) return;
    this.listening.add(id);
    const k = SPECS[id].kind, st = this.state(id);
    const update = () => {
      if (k === 'choice' && !st.properties.choices.length) return;
      if (k === 'choice') this.choices.set(id, st.properties.choices);
      this.values.set(id, k === 'slider' ? st.getNormalisedValue() : k === 'toggle' ? (st.getValue() ? 1 : 0) : st.getChoiceIndex());
      this.notify(id);
    };
    st.valueChangedEvent.addListener(update);
    st.propertiesChangedEvent.addListener(update);
    update();
  },
  connect(J) {
    this.juce = J;
    const B = window.__JUCE__.backend;
    B.addEventListener('silt_text', t => { for (const id in t) { this.texts.set(id, t[id]); this.notify(id); } });
    B.addEventListener('silt_live', l => live.fromHost(l));
    B.addEventListener('silt_ear', c => { live.curve = c; });
    B.addEventListener('silt_preset', i => presets.show(i));
    for (const id of Object.keys(SPECS)) this.listen(id);
    J.getNativeFunction('getPresets')().then(r => { presets.list = r.list; presets.build(); presets.show(r.current); });
    J.getNativeFunction('ready')();
  },
  native(name, ...args) { if (this.juce) this.juce.getNativeFunction(name)(...args); },
};

// ======================================================================================
// Controls
// ======================================================================================
let zoom = 1, dpr = window.devicePixelRatio || 1;
// Typing a value: the position whose shown text matches. Words and divisions ("off",
// "real water") match as they read; numbers are compared in the shown unit (a bare "5"
// next to "4.5 kHz" means 5 kHz; "k" and "ms" are understood).
function valueFromText(format, typed, current) {
  // ∞ / inf, × / x and the true minus sign read the same as what can be typed.
  const clean = s => String(s).trim().toLowerCase().replace(',', '.').replace(/\s+/g, ' ').replace(/infinity|∞/g, 'inf').replace(/×/g, 'x').replace(/−/g, '-');
  const want = clean(typed);
  if (!want) return null;
  const N = 2000, at = i => i / N;
  let best = null, bestScore = Infinity;
  for (let i = 0; i <= N; i++) if (clean(format(at(i))) === want && Math.abs(at(i) - current) < bestScore) best = at(i), bestScore = Math.abs(at(i) - current);
  if (best !== null) return best;
  const num = s => {
    const c = clean(s), m = c.match(/[-+]?\d*\.?\d+/);
    if (!m) return null;
    const rest = c.slice(m.index + m[0].length).trim();
    return { v: parseFloat(m[0]) * (/^k/.test(rest) ? 1000 : /^ms/.test(rest) ? 0.001 : 1), unit: /[a-z%]/.test(rest) };
  };
  const t = num(typed);
  if (!t) return null;
  let wanted = t.v;
  if (!t.unit) {  // no unit typed: the one on screen
    const shown = clean(format(current)), m = shown.match(/[-+]?\d*\.?\d+/);
    const rest = m ? shown.slice(m.index + m[0].length).trim() : '';
    wanted *= /^k/.test(rest) ? 1000 : /^ms/.test(rest) ? 0.001 : 1;
  }
  for (let i = 0; i <= N; i++) {
    const c = num(format(at(i)));
    if (!c) continue;
    const score = Math.abs(c.v - wanted) + 1e-6 * Math.abs(at(i) - current);
    if (score < bestScore) best = at(i), bestScore = score;
  }
  return best;
}
// Double-click on a value: a field to type it in (Enter sets it, Escape leaves it).
function editValue(label, format, current, commit) {
  if (label.querySelector('input')) return;
  const input = document.createElement('input');
  input.className = 'val-edit';
  input.value = label.textContent;
  input.size = Math.max(4, input.value.length);
  label.textContent = '';
  label.appendChild(input);
  input.focus();
  input.select();
  let done = false;
  const finish = ok => {
    if (done) return;
    done = true;
    const typed = input.value;
    input.remove();
    const t = ok ? valueFromText(format, typed, current()) : null;
    if (t !== null) commit(t);
    label.textContent = format(current());
  };
  input.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  input.addEventListener('pointerdown', e => e.stopPropagation());
  input.addEventListener('blur', () => finish(true));
}
const inside = (e, box) => { const r = box.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; };
// ↑ ↓ move the control under the mouse: 1 % a step, 0.1 % with Shift.
let hovered = null;
document.addEventListener('keydown', e => {
  if (!hovered || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  hovered((e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 0.001 : 0.01));
});

// Drag sideways (or up) to move, Shift for fine (10×), ↑ ↓ to step, double-click the value
// to type it, double-click elsewhere for the default, wheel steps.
function dragValue(el, id, pixels, valueEl) {
  const nudge = d => { bridge.drag(id, true); bridge.set(id, bridge.value(id) + d); bridge.drag(id, false); };
  el.addEventListener('pointerenter', () => { hovered = nudge; });
  el.addEventListener('pointerleave', () => { if (hovered === nudge) hovered = null; });
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    el.classList.add('drag');
    bridge.drag(id, true);
    let last = { x: e.clientX, y: e.clientY };
    const move = ev => {
      const dx = (ev.clientX - last.x) - (ev.clientY - last.y);
      last = { x: ev.clientX, y: ev.clientY };
      bridge.set(id, bridge.value(id) + dx / (pixels * zoom) * (ev.shiftKey ? 0.1 : 1));
    };
    const up = () => {
      el.classList.remove('drag');
      bridge.drag(id, false);
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
  });
  el.addEventListener('dblclick', e => {
    if (valueEl && inside(e, valueEl) && SPECS[id].text) {
      editValue(valueEl, SPECS[id].text, () => bridge.value(id), t => { bridge.drag(id, true); bridge.set(id, t); bridge.drag(id, false); });
      return;
    }
    bridge.drag(id, true); bridge.set(id, SPECS[id].def); bridge.drag(id, false);
  });
  el.addEventListener('wheel', e => { e.preventDefault(); bridge.drag(id, true); bridge.set(id, bridge.value(id) - Math.sign(e.deltaY) * (e.shiftKey ? 0.002 : 0.01)); bridge.drag(id, false); }, { passive: false });
}
function slider(id, root) {
  const el = document.createElement('div');
  el.className = 'ctl';

function chips(id, root) {

// The big levers: SUBMERGE (lines going from straight to wavy, the water closing over)
// and MUFFLE (lines blurring into smoke). DRY and WET: plain bars.
function lever(id, boxId, canvasId, valId, kind) {
  const box = document.getElementById(boxId), cv = document.getElementById(canvasId), val = document.getElementById(valId);
  bridge.register(id, () => { val.textContent = bridge.text(id); });
  dragValue(box, id, kind === 'bar' ? 190 : 330, val);
  // Drawn only when it has something new to show: a bar changes with its value alone, and
  // a lever at 0 has no wave inside (MUFFLE at rest: seven still lines). The sizes are
  // read twice a second (a read forces a layout pass), not every frame.
  let w = 0, h = 0, sizedAt = -1e9, drawn = '';
  const g = cv.getContext('2d');
  return t => {
    const now = performance.now();
    if (now - sizedAt > 500) { w = cv.clientWidth; h = cv.clientHeight; sizedAt = now; }
    const v = bridge.value(id);
    let resized = false;
    if (cv.width !== Math.round(w * dpr)) cv.width = Math.round(w * dpr), cv.height = Math.round(h * dpr), resized = true;
    const still = kind === 'bar' || v <= 0, look = v + '|' + w + '|' + h + '|' + dpr;
    if (still && !resized && look === drawn) return;
    drawn = still ? look : '';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    if (kind === 'bar') {
      g.fillStyle = 'rgba(236,235,229,0.12)'; g.fillRect(0, h / 2 - 1, w, 1);
      g.fillStyle = 'rgba(236,235,229,0.85)'; g.fillRect(0, h / 2 - 2, v * w, 3);
      g.fillRect(v * w - 0.5, 1, 1, h - 2);
      g.fillStyle = 'rgba(236,235,229,0.4)'; g.fillRect(w * 48 / 60, h - 4, 1, 4);  // 0 dB
      return;
    }
    // The seven lines share one colour: one path, one stroke (and for MUFFLE one blur
    // instead of seven: the filter is the costly part).
    const lines = 7;
    g.beginPath();
    for (let k = 0; k < lines; ++k) {
      const y0 = 3 + (h - 6) * k / (lines - 1);
      for (let x = 0; x <= w; x += 3) {
        const u = x / w, inside = u <= v;
        let y = y0;
        if (kind === 'submerge' && inside) y += Math.sin(x * 0.06 + t * 2.2 + k * 0.7) * 2.2 * Math.min(1, (v - u) * 6 + 0.2);
        if (kind === 'muffle' && inside) y += Math.sin(x * 0.3 + k * 9.1 + t * 1.3) * 1.6 * u;
        x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
    }
    if (kind === 'muffle') g.filter = `blur(${0.3 + 1.6 * v}px)`;
    g.strokeStyle = `rgba(236,235,229,${0.25 + 0.6 * (kind === 'muffle' ? 1 - 0.5 * v : 1)})`;
    g.lineWidth = 0.8;
    g.stroke();
    g.filter = 'none';
    g.fillStyle = 'rgba(236,235,229,0.08)'; g.fillRect(0, 0, v * w, h);
    g.fillStyle = '#ecebe5'; g.fillRect(v * w - 1, 0, 2, h);
  };
}

      menu.appendChild(it);

const live = {

function geometry() {
  const H = U.water(bridge.value('water_depth'));
  const m = Math.min(0.05, 0.25 * H);
  return {
    r: U.distance(bridge.value('distance')),
    zs: Math.min(H - m, Math.max(m, U.depth(bridge.value('src_depth')))),
    zr: Math.min(H - m, Math.max(m, U.depth(bridge.value('lis_depth')))),
    H, waves: U.waves(bridge.value('waves')), sway: U.sway(bridge.value('sway')),
    bottom: Math.round(bridge.value('bottom')), on: bridge.value('path_on') > 0.5,
  };
}
const BEDS = [
  { name: 'MUD', rho: 1.55, c: 1475, loss: 0.8 }, { name: 'SAND', rho: 2.05, c: 1725, loss: 0.88 }, { name: 'GRAVEL', rho: 2.1, c: 1850, loss: 0.85 },
  { name: 'ROCK', rho: 2.6, c: 3500, loss: 0.95 }, { name: 'REEF', rho: 2.2, c: 2600, loss: 0.78 },

// The image method (a copy of multipath.h), for drawing the paths.
function rays(G) {
  const out = [], bed = BEDS[G.bottom], r0 = Math.hypot(G.r, G.zs - G.zr);
  for (let i = 0; i < 48; ++i) {
    const f = i % 4, o = Math.floor(i / 4);
    const ns = f === 0 ? o : f === 1 ? o + 1 : f === 2 ? o : o + 1, nb = f === 0 ? o : f === 1 ? o : o + 1;
    const zi = f === 0 ? G.zs + 2 * o * G.H : f === 1 ? -G.zs - 2 * o * G.H : f === 2 ? 2 * (o + 1) * G.H - G.zs : -(2 * (o + 1) * G.H - G.zs);
    const v = Math.abs(zi - G.zr), len = Math.hypot(G.r, v), s = v / len;
    const n = 1500 / bed.c, under = n * n - (1 - s * s);
    let rb = bed.loss;
    if (under > 0) { const z = Math.sqrt(under), ms = bed.rho * s; rb = bed.loss * (ms - z) / (ms + z); }
    let g = r0 / len * Math.pow(rb, nb) * (ns % 2 ? -1 : 1) * Math.exp(-ns * 3 * G.waves * s);
    if (i > 0 && !G.on) g = 0;
    if ((len - r0) / 1500 > 2.1) g = 0;
    out.push({ zi, ns, nb, g, ms: (len - r0) / 1.5 });
  }
  return out;
}

// ======================================================================================
// The plate. Air on top, the water column, the floor; depth on a log scale so 3 m and
// 11 km both fit; the ear on the left, the source to its right at a log distance. The
// current runs from the source to the ear: the sound's way.
// ======================================================================================
const P = { w: 846, h: 532, x0: 26, x1: 822, top: 22, surf: 70, floor: 470, bottom: 512 };
const depthFrac = (z, H) => Math.log(1 + z) / Math.log(1 + H);
const yOf = (z, G) => P.surf + depthFrac(z, G.H) * (P.floor - P.surf);
const zOf = (y, G) => Math.pow(1 + G.H, Math.max(0, Math.min(1, (y - P.surf) / (P.floor - P.surf)))) - 1;
const earX = () => P.x0 + 0.13 * (P.x1 - P.x0);
const xOfR = r => P.x0 + (0.25 + 0.68 * Math.max(0, Math.min(1, Math.log(r / 0.3) / Math.log(33333.3)))) * (P.x1 - P.x0);

// ---------- stable fluids (Stam 1999) on WebGL2, drawn as smoke filaments ----------

    void main() { vUv = aPos * 0.5 + 0.5; vL = vUv - vec2(texel.x, 0.0); vR = vUv + vec2(texel.x, 0.0);

// Drag the source (distance, depth) and the ear (depth); wheel = depth of the sea.
(() => {
  const cv = document.getElementById('hud');
  let grab = null;
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * P.w, y: (e.clientY - r.top) / r.height * P.h }; };

  cv.addEventListener('pointermove', e => {
    const p = pos(e);

    fluid.step(dt, {
      srcPos: toUv(s.sx, s.sy), earPos: toUv(s.ex, s.ey), srcR: 11 / rect.h, earR: 9 / rect.h, aspect: rect.w / rect.h,
      speed: 26 + 18 * loud, waves: Math.min(1.2, s.G.waves * 2.5), time: t, shed: 0.15 + 1.2 * loud,
      curl: 4 + 14 * loud, lines: 28, keep: 0.9995,
    });
    fluid.draw({ time: t, blur: 0.4 + 3.2 * muffle, glow: 0.4 + Math.min(1, live.out), exposure: 0.55 + 0.6 * submerge }, rect);
  }
  drawArrivals();
  drawCurve();
  levers.forEach(l => l(t));
}
requestAnimationFrame(frame);

if (window.__JUCE__) bridge.connect(await import('./juce/index.js'));
else {  // browser preview: the preset names as in Presets.h
  presets.list = [
    ['MASTER', "Sous l'eau"], ['MASTER', 'Profond'], ['MASTER', 'Étouffé à fond'], ['SCÈNE', 'Plongeon'], ['SCÈNE', 'Nage près de la surface'],
    ['SCÈNE', 'Sirène, voix proche'], ['SCÈNE', 'Sirène, chant lointain'], ['SCÈNE', 'Coquille géante'], ['SCÈNE', 'Fonds marins qui bougent'],
    ['LIEU', 'Récif'], ['LIEU', 'Grotte sous-marine'], ['LIEU', 'Épave'], ['LIEU', 'Piscine'], ['LIEU', 'Aquarium'], ['LIEU', 'Sous la banquise'],
    ['LIEU', 'Haute mer, 1 km'], ['LIEU', 'Abysses, 4000 m'], ['LIEU', 'Fosse des Mariannes'], ['ÉCOUTE', 'Hydrophone documentaire'],
    ['ÉCOUTE', 'Scaphandre'], ['ÉCOUTE', 'Cinéma classique'],
  ].map(([category, name]) => ({ category, name, note: '' }));
  presets.build();
  presets.show(0);
}
